{% extends "base.html" %}
{% load static %}
{% block title %}Lien invalide{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}
{% block content %}
<div class="auth-card auth-card-error">
    <h1>Lien invalide ou expiré</h1>
    <p>Ce lien de réinitialisation n'est plus valide. Refaites une demande.</p>
    <a href="{% url 'accounts:password-reset' %}" class="btn">Nouvelle demande</a>
</div>
{% endblock %}
